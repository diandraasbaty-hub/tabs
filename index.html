<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c9b8ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TABS — keep tabs on your people</title>
<meta name="description" content="Three things open in your head. Send them to someone.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TABS">
<meta property="og:title" content="TABS">
<meta property="og:description" content="Three things open in your head. Send them to someone.">
<meta property="og:url" content="https://diandraasbaty-hub.github.io/tabs/">
<meta property="og:image" content="https://diandraasbaty-hub.github.io/tabs/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

  <!-- write ---------------------------------------------------------- -->
  <section class="screen on" id="s-write">
    <header class="bar">
      <span class="brand">TABS</span>
      <span class="date" id="w-date"></span>
      <button class="facebtn" id="w-face" aria-label="Add a photo">
        <span id="w-faceicon">＋</span>
      </button>
    </header>
    <div class="cards" id="w-cards"></div>
    <input type="file" id="w-file" accept="image/*">
    <div class="dock">
      <button class="btn big-cta" id="w-send" disabled>Send</button>
    </div>
  </section>

  <!-- someone sent you theirs ---------------------------------------- -->
  <section class="screen" id="s-got">
    <header class="bar">
      <span class="brand">TABS</span>
      <span class="date">Someone sent you their tabs</span>
    </header>
    <div class="cardshell"><img id="g-img" alt="Their TABS card"></div>
    <div class="dock">
      <button class="btn big-cta" id="g-reply">Send yours back</button>
    </div>
    <p class="hint">Three things open in your head. Takes about a minute.</p>
  </section>

  <!-- card ----------------------------------------------------------- -->
  <section class="screen" id="s-card">
    <header class="bar">
      <button class="back" id="d-back" aria-label="Back">←</button>
      <span class="date">Tap a color to change it</span>
    </header>
    <div class="cardshell"><img id="d-img" alt="Your TABS card"></div>
    <div class="swatches" id="d-swatches"></div>
    <div class="dock">
      <button class="btn big-cta" id="d-send">Send tabs</button>
      <div class="sharerow" id="d-share" hidden>
        <input id="d-url" readonly aria-label="Your link">
        <button class="btn small" id="d-copy">Copy</button>
      </div>
      <button class="linkish" id="d-again">start over</button>
    </div>
    <p class="hint" id="d-hint">One link. They see this card and get a button to send theirs back.</p>
  </section>

</div>

<div class="toast" id="toast"></div>
<canvas id="cv" hidden></canvas>

<script src="js/prompts.js"></script>
<script src="js/state.js"></script>
<script src="js/card.js"></script>
<script src="js/app.js"></script>
</body>
</html>
