<style>
/* TABS — everything bounces. */

:root{
  --ink:#3a1f4d; --surface:#fffaff;
  --t1:#ff8fc7; --t2:#a98bff; --t3:#5fc9f8;
  --bg1:#ffd3e8; --bg2:#c9b8ff; --bg3:#a6e3ff;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --pad:20px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:'Nunito',ui-rounded,-apple-system,system-ui,sans-serif;
  font-weight:700;
  color:var(--ink);
  background:linear-gradient(150deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;
  transition:background .6s ease;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before,body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(60px);
  opacity:.5;pointer-events:none;z-index:0;
}
body::before{width:60vw;height:60vw;background:var(--t1);top:-18vw;left:-14vw;
  animation:drift 18s ease-in-out infinite alternate}
body::after{width:55vw;height:55vw;background:var(--t3);bottom:-16vw;right:-12vw;
  animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate3d(6vw,4vw,0) scale(1.15)}}

.app{
  position:relative;z-index:1;
  min-height:100dvh;max-width:520px;margin:0 auto;
  padding:var(--pad);
  display:flex;flex-direction:column;
}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex;animation:pop .4s var(--spring) both}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}}

/* ---------- bar ---------- */
.bar{display:flex;align-items:center;gap:12px;min-height:48px;margin-bottom:26px}
.brand{font-size:26px;font-weight:800;letter-spacing:-.045em}
.date{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  opacity:.5}
.back{
  border:0;background:rgba(255,255,255,.6);color:var(--ink);
  width:42px;height:42px;border-radius:50%;font-size:19px;font-weight:800;
  cursor:pointer;transition:transform .25s var(--spring)
}
.back:active{transform:scale(.88)}
.facebtn{
  margin-left:auto;width:48px;height:48px;border-radius:50%;flex:none;
  border:3px solid rgba(255,255,255,.85);background:rgba(255,255,255,.5);
  background-size:cover;background-position:center;
  color:var(--ink);font-size:22px;font-weight:800;line-height:1;cursor:pointer;
  box-shadow:0 6px 16px rgba(60,30,90,.16);
  transition:transform .3s var(--spring)
}
.facebtn:active{transform:scale(.9)}
.facebtn.has{border-color:#fff;box-shadow:0 8px 20px rgba(60,30,90,.28)}
input[type=file]{display:none}

/* ---------- the three cards ---------- */
.cards{display:flex;flex-direction:column;gap:44px}
.tabcard{
  background:var(--surface);border-radius:30px;padding:16px 20px 18px;
  box-shadow:0 14px 32px rgba(60,30,90,.15);
  position:relative;
  animation:pop .45s var(--spring) both;
}
.tabcard::before{
  content:"";position:absolute;top:-32px;left:24px;width:128px;height:34px;
  border-radius:18px 18px 0 0;background:var(--tabcolor,var(--t1));
  box-shadow:0 -5px 14px rgba(60,30,90,.1)
}
.tabcard::after{
  content:"";position:absolute;top:-22px;left:40px;width:92px;height:10px;
  border-radius:5px;background:rgba(255,255,255,.6)
}
.cardhead{display:flex;align-items:center;gap:10px;min-height:34px}
.slotlabel{
  font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--tabcolor,var(--t1))
}
.moodchip{
  margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;
  border:0;background:rgba(0,0,0,.05);font-size:19px;line-height:1;
  cursor:pointer;transition:transform .25s var(--spring)
}
.moodchip:active{transform:scale(.86)}
.moodchip.bump{animation:bump .4s var(--spring)}
@keyframes bump{40%{transform:scale(1.28) rotate(-8deg)}}

/* the prompt is a label, not the content — the answer below is the hero */
.wildq{
  font-size:15px;font-weight:800;line-height:1.3;margin-top:2px;
  opacity:.55;letter-spacing:.01em
}
.wildq::before{content:"⭐ "}

.field{
  display:block;width:100%;border:0;outline:0;background:transparent;resize:none;
  overflow:hidden;
  font-family:inherit;font-weight:700;color:var(--ink);
  font-size:21px;line-height:1.35;margin-top:6px;min-height:30px;
}
.field::placeholder{color:var(--ink);opacity:.26}

/* ---------- dock ---------- */
.dock{
  position:sticky;bottom:0;margin-top:auto;
  padding:26px 0 calc(6px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:4px;
}
.dock::before{
  content:"";position:absolute;top:-10px;bottom:-30px;
  left:50%;transform:translateX(-50%);width:100vw;z-index:-1;
  background:linear-gradient(to top,var(--bg3) 55%,transparent);
  opacity:.9;pointer-events:none
}
.btn{
  border:0;cursor:pointer;font-family:inherit;font-weight:800;
  font-size:20px;letter-spacing:.02em;
  padding:20px 26px;border-radius:999px;
  background:var(--ink);color:#fff;
  box-shadow:0 12px 26px rgba(60,30,90,.28);
  transition:transform .3s var(--spring),opacity .25s
}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.3;box-shadow:none;cursor:default}
.btn.big-cta{font-size:21px;padding:22px 26px}
.minirow{display:flex;justify-content:center;gap:4px}
.linkish{
  background:none;border:0;font-family:inherit;font-weight:800;font-size:15px;
  color:var(--ink);opacity:.5;cursor:pointer;padding:12px
}

/* ---------- card screen ---------- */
.cardshell{
  width:100%;border-radius:26px;overflow:hidden;
  box-shadow:0 22px 50px rgba(60,30,90,.26);
  animation:pop .5s var(--spring) both;background:rgba(255,255,255,.4)
}
.cardshell img{
  width:100%;display:block;
  -webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto
}
.swatches{display:flex;gap:10px;justify-content:center;margin-top:20px}
.swatch{
  width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.85);
  cursor:pointer;padding:0;transition:transform .3s var(--spring)
}
.swatch.on{transform:scale(1.2);border-color:var(--ink)}
.hint{
  font-size:13px;font-weight:800;opacity:.45;line-height:1.45;text-align:center;
  margin:0 0 calc(4px + env(safe-area-inset-bottom))
}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,160%);
  background:var(--ink);color:#fff;padding:14px 22px;border-radius:999px;
  font-weight:800;font-size:15px;z-index:9;opacity:0;pointer-events:none;
  transition:transform .45s var(--spring),opacity .3s;
  max-width:90vw;text-align:center
}
.toast.on{transform:translate(-50%,0);opacity:1}

:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

</style>

const WILDCARDS = [

/* Rotating placeholder examples so the empty field never feels blank. */
const EXAMPLES = {

const MOODS = ["\u{1F4AD}", "\u{1F62E}‍\u{1F4A8}", "\u{1F979}", "\u{1F929}", "\u{1FAE0}", "\u{1F602}"];

<script>
/* TABS — themes, dates, and everything that touches localStorage. */

const THEMES = [
  { id: "bubblegum", name: "Bubblegum",
    bg: ["#ffd3e8", "#c9b8ff", "#a6e3ff"],
    tabs: ["#ff8fc7", "#a98bff", "#5fc9f8"],
    ink: "#3a1f4d", surface: "#fffaff" },
  { id: "sherbet", name: "Sherbet",
    bg: ["#ffe1b8", "#ffb3a0", "#ff9fc4"],
    tabs: ["#ffb03b", "#ff7a66", "#ff77ab"],
    ink: "#4d2418", surface: "#fffdf7" },
  { id: "pool", name: "Pool",
    bg: ["#bff3ff", "#8fd0ff", "#a9b4ff"],
    tabs: ["#3ec9e0", "#4a9df7", "#7f86ff"],
    ink: "#12324d", surface: "#fbfeff" },
  { id: "limeade", name: "Limeade",
    bg: ["#e4ffb8", "#a8f0c6", "#7fe3e0"],
    tabs: ["#9fdc3c", "#41cf95", "#2fc4c4"],
    ink: "#1d3d24", surface: "#fcfff7" },
  { id: "grape", name: "Grape",
    bg: ["#e0c9ff", "#b7a6ff", "#8fb6ff"],
    tabs: ["#b072ff", "#7d78ff", "#5a9bff"],
    ink: "#2e1a52", surface: "#fdfbff" },
  { id: "sunbeam", name: "Sunbeam",
    bg: ["#fff2a8", "#ffd08a", "#ffab7d"],
    tabs: ["#ffd23c", "#ffa53c", "#ff8360"],
    ink: "#4a3410", surface: "#fffdf3" }
];

const themeById = id => THEMES.find(t => t.id === id) || THEMES[0];

/* --- dates --------------------------------------------------------- */

function todayKey(d) {
  const t = d || new Date();
  const p = n => String(n).padStart(2, "0");
  return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`;
}

function prettyDate(key) {
  const [y, m, d] = key.split("-").map(Number);
  const months = ["JAN","FEB","MAR","APR","MAY","JUN",
                  "JUL","AUG","SEP","OCT","NOV","DEC"];
  return `${months[m - 1]} ${d}`;
}

/* Everyone gets the same wildcard on the same calendar day. Seeded by the
   date string alone so it never depends on device, timezone offset math,
   or how many times the app has been opened. */
function wildcardFor(key) {
  let h = 2166136261;
  for (let i = 0; i < key.length; i++) {
    h ^= key.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return WILDCARDS[Math.abs(h) % WILDCARDS.length];
}

function pickExample(bank, key) {
  let h = 5381;
  for (let i = 0; i < key.length; i++) h = ((h << 5) + h + key.charCodeAt(i)) | 0;
  return bank[Math.abs(h) % bank.length];
}

/* --- storage ------------------------------------------------------- */

const STORE_KEY = "tabs-v1";

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return { draft: null, history: [], theme: null };
    const parsed = JSON.parse(raw);
    return {
      draft: parsed.draft || null,
      history: Array.isArray(parsed.history) ? parsed.history : [],
      theme: parsed.theme || null
    };
  } catch (e) {
    return { draft: null, history: [], theme: null };
  }
}

function saveStore(store) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      draft: store.draft,
      history: store.history.slice(0, 7),
      theme: store.theme
    }));
  } catch (e) { /* private mode, full disk — the app still works */ }
}

/* History never keeps the photo. A week of data URLs blows the quota. */
function pushHistory(store, entry) {
  const rest = store.history.filter(h => h.date !== entry.date);
  store.history = [{
    date: entry.date,
    theme: entry.theme,
    wild: entry.wild,
    tabs: entry.tabs.map(t => ({ text: t.text, mood: t.mood }))
  }].concat(rest).slice(0, 7);
  saveStore(store);
}

</script>
<script>
/* TABS — the card renderer.
   Everything a friend sees is drawn here. 1080x1350 so it lands big in a
   text thread without being cropped. */

const CARD_W = 1080;
const APP_URL = "diandraasbaty-hub.github.io/tabs";
const FONT = "'Nunito', ui-rounded, -apple-system, system-ui, sans-serif";
const LABELS = ["A RANDOM THOUGHT", "WHAT I'M DOING", "NEW TAB"];

const font = (weight, size) => `${weight} ${size}px ${FONT}`;

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* A soft organic blob rather than a circle — the photo should look dropped
   in by hand, not cropped by a computer. */
function blobPath(ctx, cx, cy, r) {
  const k = 0.5523 * r;
  const j = (n) => r * n;
  ctx.beginPath();
  ctx.moveTo(cx, cy - j(1.04));
  ctx.bezierCurveTo(cx + k * 1.12, cy - j(1.02), cx + j(1.06), cy - k * 0.92, cx + j(1.0), cy);
  ctx.bezierCurveTo(cx + j(0.96), cy + k * 1.1, cx + k * 0.94, cy + j(1.05), cx, cy + j(0.99));
  ctx.bezierCurveTo(cx - k * 1.08, cy + j(0.96), cx - j(1.03), cy + k * 0.96, cx - j(0.99), cy);
  ctx.bezierCurveTo(cx - j(0.96), cy - k * 1.06, cx - k * 0.98, cy - j(1.02), cx, cy - j(1.04));
  ctx.closePath();
}

function wrap(ctx, text, maxWidth, maxLines) {
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = w;
      if (lines.length === maxLines) break;
    } else {
      line = test;
    }
  }
  if (lines.length < maxLines && line) lines.push(line);
  if (lines.length === maxLines) {
    let last = lines[maxLines - 1];
    const used = words.join(" ");
    if (lines.join(" ").length < used.length) {
      while (last.length > 4 && ctx.measureText(last + "…").width > maxWidth) {
        last = last.slice(0, -1);
      }
      lines[maxLines - 1] = last.replace(/[\s,.]+$/, "") + "…";
    }
  }
  return lines;
}

/* data = { tabs:[{text,mood}], wild, photo, theme, date }
   The canvas height is computed from the content — a fixed 1350 left a field
   of empty gradient under short answers, which is most of them. */
function drawCard(canvas, data) {
  const t = themeById(data.theme);
  const ctx = canvas.getContext("2d");

  const M = 74, WW = CARD_W - M * 2, WR = 54, PAD = 62;
  const textW = WW - PAD * 2 - 96;
  const HEADLINE = "3 TABS OPEN IN MY HEAD";

  /* measure everything before sizing the canvas */
  canvas.width = CARD_W;
  canvas.height = 100;
  let size = 48, blocks;
  for (;;) {
    ctx.font = font(700, size);
    blocks = data.tabs.map((tab, i) => {
      const lines = wrap(ctx, tab.text || "—", textW, 3);
      const label = i === 2
        ? "NEW TAB · " + (data.wild || "").toUpperCase()
        : LABELS[i];
      return { lines, label, h: 44 + lines.length * (size * 1.28) + 46 };
    });
    if (blocks.reduce((s, b) => s + b.h, 0) <= 780 || size <= 32) break;
    size -= 4;
  }
  /* the photo rides beside the headline like an avatar — parked over the
     window it covered the third answer */
  const hasPhoto = !!(data.photo && data.photo.img);
  const PR = 112;
  ctx.font = font(800, 58);
  const headLines = wrap(ctx, HEADLINE, hasPhoto ? WW - 268 : WW, 2);

  const TOP = 76;
  const headH = Math.max(headLines.length * 66 + 78, hasPhoto ? 244 : 0);
  const TABSTRIP = 76;
  const WH = Math.round(60 + blocks.reduce((s, b) => s + b.h, 0) + 20);
  const footH = 150;
  const CARD_H = Math.round(TOP + headH + 34 + TABSTRIP + WH + footH);

  canvas.width = CARD_W;
  canvas.height = CARD_H;
  ctx.clearRect(0, 0, CARD_W, CARD_H);

  /* background */
  const g = ctx.createLinearGradient(0, 0, CARD_W * 0.35, CARD_H);
  g.addColorStop(0, t.bg[0]);
  g.addColorStop(0.55, t.bg[1]);
  g.addColorStop(1, t.bg[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CARD_W, CARD_H);

  ctx.save();
  ctx.globalAlpha = 0.5;
  [[120, 130, 380, t.tabs[0]], [1010, CARD_H * 0.42, 420, t.tabs[2]],
   [170, CARD_H - 90, 340, t.tabs[1]]].forEach(([x, y, r, c]) => {
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, c);
    rg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();

  /* headline — so a friend knows what they are looking at */
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = t.ink;
  ctx.font = font(800, 58);
  let hy = TOP + 54;
  headLines.forEach(ln => { ctx.fillText(ln, M + 6, hy); hy += 66; });
  ctx.font = font(800, 30);
  ctx.globalAlpha = 0.5;
  ctx.fillText(prettyDate(data.date), M + 8, hy + 4);
  ctx.globalAlpha = 1;

  const WY = TOP + headH + 34 + TABSTRIP;

  /* tabs perched on the window's top edge */
  const tw = 286, th = 118, gap = -12;
  let tx = M + 26;
  data.tabs.forEach((tab, i) => {
    ctx.save();
    ctx.translate(tx + tw / 2, WY - TABSTRIP + th / 2);
    ctx.rotate((i - 1) * 0.012);
    ctx.fillStyle = t.tabs[i];
    roundRect(ctx, -tw / 2, -th / 2, tw, th + 46, 30);
    ctx.fill();
    const vis = -21;
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    roundRect(ctx, -tw / 2 + 22, vis - 8, tw - 118, 16, 8);
    ctx.fill();
    ctx.font = font(400, 40);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(tab.mood || MOODS[0], tw / 2 - 48, vis);
    ctx.restore();
    tx += tw + gap;
  });

  /* window */
  ctx.save();
  ctx.shadowColor = "rgba(40,20,70,0.2)";
  ctx.shadowBlur = 48;
  ctx.shadowOffsetY = 18;
  ctx.fillStyle = t.surface;
  roundRect(ctx, M, WY, WW, WH, WR);
  ctx.fill();
  ctx.restore();

  /* entries */
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  let y = WY + 74;
  blocks.forEach((b, i) => {
    ctx.fillStyle = t.tabs[i];
    ctx.font = font(800, 24);
    ctx.fillText(b.label, M + PAD + 96, y);

    ctx.font = font(400, 44);
    ctx.fillText(data.tabs[i].mood || MOODS[0], M + PAD + 6, y + 44);

    ctx.fillStyle = t.ink;
    ctx.font = font(700, size);
    b.lines.forEach((ln, k) => {
      ctx.fillText(ln, M + PAD + 96, y + 46 + k * (size * 1.28));
    });

    y += b.h;
    if (i < 2) {
      ctx.fillStyle = t.ink;
      ctx.globalAlpha = 0.08;
      roundRect(ctx, M + PAD + 96, y - 34, WW - PAD * 2 - 96, 4, 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  });

  /* photo */
  if (hasPhoto) {
    const cx = CARD_W - M - PR, cy = TOP + PR + 4;
    ctx.save();
    ctx.shadowColor = "rgba(40,20,70,0.28)";
    ctx.shadowBlur = 30;
    ctx.shadowOffsetY = 10;
    ctx.fillStyle = "#fff";
    ctx.translate(cx, cy);
    ctx.rotate(-0.06);
    blobPath(ctx, 0, 0, PR + 12);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.06);
    blobPath(ctx, 0, 0, PR);
    ctx.clip();
    const im = data.photo.img;
    const sc = Math.max((PR * 2) / im.width, (PR * 2) / im.height);
    ctx.drawImage(im, -im.width * sc / 2, -im.height * sc / 2,
                  im.width * sc, im.height * sc);
    ctx.restore();
  }

  /* footer — an instruction and an address, not a fake button */
  const fy = WY + WH + 72;
  ctx.textAlign = "center";
  ctx.fillStyle = t.ink;
  ctx.globalAlpha = 0.88;
  ctx.font = font(800, 46);
  ctx.fillText("SEND YOUR TABS BACK!", CARD_W / 2, fy);
  ctx.globalAlpha = 0.5;
  ctx.font = font(800, 30);
  ctx.fillText(APP_URL, CARD_W / 2, fy + 46);
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";
}

function canvasToBlob(canvas) {
  return new Promise(res => canvas.toBlob(res, "image/png", 0.95));
}

/* The share sheet is the happy path, but it is blocked in embedded viewers
   and missing on desktop. The caller always shows the press-and-hold image
   too, so a false return here is not a failure. */
/* Safari wants the ClipboardItem built inside the user gesture, so the blob
   is handed over as a promise rather than awaited first. */
async function copyCard(canvas) {
  if (!navigator.clipboard || !window.ClipboardItem) return false;
  try {
    await navigator.clipboard.write([
      new ClipboardItem({ "image/png": canvasToBlob(canvas) })
    ]);
    return true;
  } catch (e) {
    try {
      const blob = await canvasToBlob(canvas);
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      return true;
    } catch (e2) { return false; }
  }
}

async function shareCard(canvas, dateKey) {
  const blob = await canvasToBlob(canvas);
  if (!blob) return false;
  const file = new File([blob], `tabs-${dateKey}.png`, { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({
        files: [file],
        text: "3 tabs open in my head. Send yours back \u2192 https://" + APP_URL
      });
      return true;
    } catch (e) {
      return e && e.name === "AbortError" ? true : false;
    }
  }
  return false;
}

</script>
<script>
/* TABS — two screens. Write, send. */

const $ = id => document.getElementById(id);
const store = loadStore();
const DATE = todayKey();
const WILD = wildcardFor(DATE);  /* LABELS comes from card.js */

const state = {
  theme: store.theme || THEMES[0].id,
  tabs: [
    { text: "", mood: MOODS[0] },
    { text: "", mood: MOODS[0] },
    { text: "", mood: MOODS[0] }
  ],
  photo: null
};

if (store.draft && store.draft.date === DATE) {
  state.tabs = store.draft.tabs.map(t => ({
    text: t.text || "", mood: t.mood || MOODS[0]
  }));
  if (store.draft.theme) state.theme = store.draft.theme;
}

/* ---------- theme ---------- */
function applyTheme() {
  const t = themeById(state.theme);
  const r = document.documentElement.style;
  r.setProperty("--ink", t.ink);
  r.setProperty("--surface", t.surface);
  r.setProperty("--bg1", t.bg[0]);
  r.setProperty("--bg2", t.bg[1]);
  r.setProperty("--bg3", t.bg[2]);
  t.tabs.forEach((c, i) => r.setProperty("--t" + (i + 1), c));
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute("content", t.bg[1]);
}

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $(id).classList.add("on");
  window.scrollTo(0, 0);
}

let toastTimer;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2600);
}

function saveDraft() {
  store.draft = { date: DATE, theme: state.theme, tabs: state.tabs };
  store.theme = state.theme;
  saveStore(store);
}

/* ---------- the three cards, all on one screen ---------- */
function grow(field) {
  field.style.height = "auto";
  field.style.height = field.scrollHeight + "px";
}

function buildCards() {
  const wrap = $("w-cards");
  wrap.innerHTML = "";
  state.tabs.forEach((tab, i) => {
    const card = document.createElement("div");
    card.className = "tabcard";
    card.style.setProperty("--tabcolor", themeById(state.theme).tabs[i]);

    const head = document.createElement("div");
    head.className = "cardhead";

    const label = document.createElement("span");
    label.className = "slotlabel";
    label.textContent = LABELS[i];
    head.appendChild(label);

    /* one chip, tap to cycle — a six-button row for every line was the
       bulkiest thing on the old screen */
    const chip = document.createElement("button");
    chip.className = "moodchip";
    chip.type = "button";
    chip.textContent = tab.mood;
    chip.setAttribute("aria-label", "Change the mood");
    chip.onclick = () => {
      const next = (MOODS.indexOf(tab.mood) + 1) % MOODS.length;
      tab.mood = MOODS[next];
      chip.textContent = tab.mood;
      chip.classList.remove("bump");
      void chip.offsetWidth;
      chip.classList.add("bump");
      saveDraft();
    };
    head.appendChild(chip);
    card.appendChild(head);

    if (i === 2) {
      const q = document.createElement("div");
      q.className = "wildq";
      q.textContent = WILD;
      card.appendChild(q);
    }

    const field = document.createElement("textarea");
    field.className = "field";
    field.rows = 1;
    field.maxLength = 90;
    field.value = tab.text;
    field.placeholder = pickExample(
      [EXAMPLES.thought, EXAMPLES.doing, EXAMPLES.wild][i], DATE);
    field.addEventListener("input", () => {
      tab.text = field.value;
      grow(field);
      refreshSend();
      saveDraft();
    });
    card.appendChild(field);
    wrap.appendChild(card);
    grow(field);
  });
}

function refreshSend() {
  $("w-send").disabled = !state.tabs.every(t => t.text.trim());
}

/* ---------- photo, inline ---------- */
$("w-face").onclick = () => $("w-file").click();

$("w-file").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      state.photo = { img: img, src: ev.target.result };
      const btn = $("w-face");
      btn.classList.add("has");
      btn.style.backgroundImage = `url(${ev.target.result})`;
      $("w-faceicon").textContent = "";
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

/* ---------- card ---------- */
function render() {
  applyTheme();
  const cv = $("cv");
  drawCard(cv, {
    tabs: state.tabs, wild: WILD, photo: state.photo,
    theme: state.theme, date: DATE
  });
  $("d-img").src = cv.toDataURL("image/png");
  paintSwatches();
  saveDraft();
}

function paintSwatches() {
  const box = $("d-swatches");
  box.innerHTML = "";
  THEMES.forEach(t => {
    const b = document.createElement("button");
    b.className = "swatch" + (t.id === state.theme ? " on" : "");
    b.type = "button";
    b.setAttribute("aria-label", t.name);
    b.style.background = `linear-gradient(140deg,${t.bg[0]},${t.tabs[1]})`;
    b.onclick = () => { state.theme = t.id; render(); };
    box.appendChild(b);
  });
}

$("w-send").onclick = () => { render(); show("s-card"); };
$("d-back").onclick = () => { buildCards(); show("s-write"); };

$("d-again").onclick = () => {
  state.tabs = state.tabs.map(() => ({ text: "", mood: MOODS[0] }));
  state.photo = null;
  const btn = $("w-face");
  btn.classList.remove("has");
  btn.style.backgroundImage = "";
  $("w-faceicon").textContent = "＋";
  $("d-hint").textContent = "Or press and hold the card to copy it.";
  saveDraft();
  buildCards();
  refreshSend();
  show("s-write");
};

$("d-link").onclick = async () => {
  const url = "https://" + APP_URL;
  try {
    await navigator.clipboard.writeText(url);
    toast("Link copied. Paste it under your card.");
  } catch (e) {
    toast(APP_URL);
  }
};

function remember() {
  pushHistory(store, { date: DATE, theme: state.theme, wild: WILD, tabs: state.tabs });
}

$("d-send").onclick = async () => {
  remember();
  if (await shareCard($("cv"), DATE)) return;
  if (await copyCard($("cv"))) {
    toast("Copied. Open Messages and paste it.");
    $("d-hint").textContent =
      "On your clipboard — paste it into any text, then send the link too.";
    return;
  }
  toast("Press and hold the card → Copy");
  $("d-hint").textContent =
    "Sharing is blocked here. Press and hold the card, choose Copy, then paste it into Messages.";
};

/* ---------- boot ---------- */
applyTheme();
$("w-date").textContent = prettyDate(DATE);
buildCards();
refreshSend();
if (document.fonts && document.fonts.load) {
  document.fonts.load("800 48px Nunito").catch(() => {});
}

</script>
</body>
</html>
